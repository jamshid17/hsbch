name: CI

# Runs on every pull request, and is called by the deploy workflow before it
# touches the server — main deploys straight to production, so this is the
# only thing standing between a broken commit and the people using the app.
on:
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile, so a lint or test result here means
          # the same thing it would mean in the image.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: flake8 .

      - name: Test
        working-directory: backend
        run: pytest -q

      - name: Import the app
        working-directory: backend
        # Catches what unit tests can't: a router that no longer imports, a
        # dependency signature FastAPI rejects at registration time.
        env:
          ANTHROPIC_API_KEY: test
          BOT_TOKEN: "1:test"
          WEBAPP_URL: https://example.test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          TELEGRAM_WEBHOOK_SECRET: test
        run: python -c "import app.main; print(len(app.main.app.routes), 'routes')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches frontend/Dockerfile.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

name: Deploy to server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            cd /srv/hsbch
            git pull https://github.com/jamshid17/hsbch main
            # App version shown in the navbar: deploy run number rebased to
            # start at 1 (run #12 is the first build with versioning → v1).
            APP_VERSION=$(( ${{ github.run_number }} - 11 )) docker compose -f docker-compose.yml up -d --build
